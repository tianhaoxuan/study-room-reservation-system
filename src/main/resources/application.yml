server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/zixishi?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jackson:
    time-zone: Asia/Shanghai
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false
    baseline-version: 1

mybatis:
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.smartstudy.studyroom.mapper: debug

studyroom:
  auth:
    token-secret: ${STUDYROOM_TOKEN_SECRET:dev-only-change-me-study-room-token-secret}
    token-ttl-seconds: ${STUDYROOM_TOKEN_TTL_SECONDS:86400}
