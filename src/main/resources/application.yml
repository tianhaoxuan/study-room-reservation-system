server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/zixishi?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jackson:
    time-zone: Asia/Shanghai
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 2s
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false
    baseline-version: 1

mybatis:
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.smartstudy.studyroom.mapper: debug

studyroom:
  auth:
    token-secret: ${STUDYROOM_TOKEN_SECRET:dev-only-change-me-study-room-token-secret}
    token-ttl-seconds: ${STUDYROOM_TOKEN_TTL_SECONDS:86400}
  timeout-scan:
    enabled: ${STUDYROOM_TIMEOUT_SCAN_ENABLED:true}
    fixed-delay-ms: ${STUDYROOM_TIMEOUT_SCAN_FIXED_DELAY_MS:60000}
    batch-size: ${STUDYROOM_TIMEOUT_SCAN_BATCH_SIZE:100}
    look-back: ${STUDYROOM_TIMEOUT_SCAN_LOOK_BACK:24h}
  rabbitmq:
    checkin-timeout:
      enabled: ${STUDYROOM_RABBITMQ_CHECKIN_TIMEOUT_ENABLED:false}
      listener-auto-startup: ${STUDYROOM_RABBITMQ_CHECKIN_TIMEOUT_LISTENER_AUTO_STARTUP:false}
      dead-letter-listener-auto-startup: ${STUDYROOM_RABBITMQ_CHECKIN_TIMEOUT_DEAD_LETTER_LISTENER_AUTO_STARTUP:false}
    outbox-retry:
      enabled: ${STUDYROOM_RABBITMQ_OUTBOX_RETRY_ENABLED:true}
      fixed-delay-ms: ${STUDYROOM_RABBITMQ_OUTBOX_RETRY_FIXED_DELAY_MS:60000}
      max-retry-count: ${STUDYROOM_RABBITMQ_OUTBOX_RETRY_MAX_RETRY_COUNT:5}
      batch-size: ${STUDYROOM_RABBITMQ_OUTBOX_RETRY_BATCH_SIZE:50}
  redis:
    seat-occupancy:
      enabled: ${STUDYROOM_REDIS_SEAT_OCCUPANCY_ENABLED:true}
      key-prefix: ${STUDYROOM_REDIS_SEAT_OCCUPANCY_KEY_PREFIX:seat:bitmap}
      ttl-days: ${STUDYROOM_REDIS_SEAT_OCCUPANCY_TTL_DAYS:45}
      rebuild-lock:
        enabled: ${STUDYROOM_REDIS_SEAT_OCCUPANCY_REBUILD_LOCK_ENABLED:true}
        key-prefix: ${STUDYROOM_REDIS_SEAT_OCCUPANCY_REBUILD_LOCK_KEY_PREFIX:lock:seat:bitmap:rebuild}
        wait-time: ${STUDYROOM_REDIS_SEAT_OCCUPANCY_REBUILD_LOCK_WAIT_TIME:100ms}
        lease-time: ${STUDYROOM_REDIS_SEAT_OCCUPANCY_REBUILD_LOCK_LEASE_TIME:10s}